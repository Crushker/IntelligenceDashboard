# ─────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy Configuration
# TLS 1.3, SSL hardening, rate limiting, security headers
# Compliant with CERT-In and RBI IT Governance guidelines
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ─── Basic Settings ─────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Hide nginx version
    
    # ─── Logging ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time';
    
    access_log /var/log/nginx/access.log main;
    
    # ─── Rate Limiting Zones ────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # ─── Gzip Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    
    # ─── SSL Configuration (TLS 1.3 + Hardened TLS 1.2) ────────────────────
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # ─── Upstream Definitions ───────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }
    
    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }
    
    # ─── HTTP → HTTPS Redirect ──────────────────────────────────────────────
    server {
        listen 80;
        server_name nbfcintel.in www.nbfcintel.in api.nbfcintel.in;
        
        # Let's Encrypt verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # ─── HTTPS Server - Frontend ────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name nbfcintel.in www.nbfcintel.in;
        
        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/nbfcintel.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nbfcintel.in/privkey.pem;
        
        # ─── Security Headers ───────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://img.youtube.com; connect-src 'self' https://api.nbfcintel.in;" always;
        
        # ─── Rate Limiting ──────────────────────────────────────────────────
        limit_req zone=general_limit burst=20 nodelay;
        limit_conn conn_limit 50;
        
        # ─── Request Size Limits ────────────────────────────────────────────
        client_max_body_size 10M;
        client_body_buffer_size 128k;
        
        # ─── Frontend Proxy ─────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # ─── Static Assets Caching ──────────────────────────────────────────
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    
    # ─── HTTPS Server - API ─────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.nbfcintel.in;
        
        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/api.nbfcintel.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.nbfcintel.in/privkey.pem;
        
        # ─── Security Headers ───────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        
        # ─── Rate Limiting ──────────────────────────────────────────────────
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 100;
        
        # ─── Request Size Limits ────────────────────────────────────────────
        client_max_body_size 5M;
        
        # ─── Auth Endpoints (Stricter Rate Limiting) ────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
        
        # ─── API Proxy ──────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeouts for long-running intelligence queries
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
        
        # ─── Health Check (No Rate Limiting) ────────────────────────────────
        location /health {
            proxy_pass http://backend;
            access_log off;
        }
        
        # ─── Block Sensitive Paths ──────────────────────────────────────────
        location ~ /\.(git|env|htaccess) {
            deny all;
            return 404;
        }
        
        location /api/docs {
            # Only allow in development (controlled by FastAPI config)
            deny all;
            return 404;
        }
    }
}
